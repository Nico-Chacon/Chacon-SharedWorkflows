name: Deploy API

on:
  workflow_call:
    inputs:
      image-name:
        description: Nombre de la imagen en Docker Hub
        required: true
        type: string
      image-tag:
        description: v1.0.0
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repo
        uses: actions/checkout@v4
      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & Push
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"
          docker build -t "${IMAGE}:${{ inputs.image-tag }}" -t "${IMAGE}:latest" .
          docker push --all-tags "${IMAGE}"

